<rect x="1040" y="1000" width="7" height="145" rx="3" fill="#17834B"/>
<text x="1058" y="1032" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="17" font-weight="600" fill="#172033">数据服务与产品运维</text>
<text x="1060" y="1067" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 提供数据接口与任务调度</text>
<text x="1060" y="1091" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 负责监控、告警、权限和日志</text>
<text x="1060" y="1115" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 支持版本发布与故障响应</text>
