<text x="1285" y="717" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 输出商品级调价清单</text>
<text x="1285" y="741" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 生成经营驾驶舱和报告</text>
<text x="1285" y="765" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 解释策略依据与适用边界</text>
<rect x="1600" y="650" width="285" height="155" rx="12" fill="#FFFFFF" stroke="#285DA8" stroke-width="1.8"/>
<rect x="1600" y="650" width="7" height="155" rx="3" fill="#285DA8"/>
