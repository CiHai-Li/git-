<text x="1448" y="1032" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="17" font-weight="600" fill="#172033">效果数据沉淀</text>
<text x="1450" y="1067" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 汇总销量、转化、毛利和库存</text>
<text x="1450" y="1091" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 沉淀实验组及对照组结果</text>
<text x="1450" y="1115" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 回流业务中台支持复盘</text>
