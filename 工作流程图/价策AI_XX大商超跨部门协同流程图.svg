<rect x="80" y="525" width="140" height="360" rx="16" fill="#285DA8"/>
<text x="150" y="693.0" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="600" fill="#FFFFFF">业务中台部门</text>
<text x="150" y="722.0" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="12" font-weight="400" fill="#FFFFFF">策略与产品责任端</text>
<rect x="80" y="910" width="1840" height="250" rx="16" fill="#ECFDF3" stroke="#D4DAE3" stroke-width="1.3"/>
<rect x="80" y="910" width="140" height="250" rx="16" fill="#17834B"/>
<text x="150" y="1023.0" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="600" fill="#FFFFFF">数据分析部门</text>
<text x="150" y="1052.0" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="12" font-weight="400" fill="#FFFFFF">数据与技术支持端</text>
<text x="1915" y="235" text-anchor="end" font-family="Microsoft YaHei,Arial" font-size="12" font-weight="500" fill="#667085">控制点：需求评审｜数据准入｜策略评审｜效果归因</text>
<rect x="260" y="320" width="280" height="145" rx="12" fill="#FFFFFF" stroke="#C9342C" stroke-width="1.8"/>
<rect x="260" y="320" width="7" height="145" rx="3" fill="#C9342C"/>
<text x="278" y="352" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="17" font-weight="600" fill="#172033">业务需求输入</text>
<text x="280" y="387" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 明确经营目标与活动节奏</text>
<text x="280" y="411" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 提供商家、货盘及库存结构</text>
<text x="280" y="435" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 提出价格痛点与支持需求</text>
<rect x="1375" y="320" width="270" height="145" rx="12" fill="#FFFFFF" stroke="#C9342C" stroke-width="1.8"/>
<rect x="1375" y="320" width="7" height="145" rx="3" fill="#C9342C"/>
<text x="1393" y="352" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="17" font-weight="600" fill="#172033">业务审核与执行</text>
<text x="1395" y="387" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 确认目标商品和策略边界</text>
<text x="1395" y="411" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 人工审核价格调整建议</text>
<text x="1395" y="435" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 在业务系统执行调价</text>
<rect x="1685" y="320" width="250" height="145" rx="12" fill="#FFFFFF" stroke="#C9342C" stroke-width="1.8"/>
<rect x="1685" y="320" width="7" height="145" rx="3" fill="#C9342C"/>
<text x="1703" y="352" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="17" font-weight="600" fill="#172033">经营效果反馈</text>
<text x="1705" y="387" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 反馈销量、转化与毛利</text>
<text x="1705" y="411" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 补充库存及商家变化</text>
<text x="1705" y="435" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 提交异常与新增需求</text>
<rect x="260" y="650" width="285" height="155" rx="12" fill="#FFFFFF" stroke="#285DA8" stroke-width="1.8"/>
<rect x="260" y="650" width="7" height="155" rx="3" fill="#285DA8"/>
<text x="278" y="682" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="17" font-weight="600" fill="#172033">需求受理与分级</text>
<text x="280" y="717" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 识别业务组、场景和目标</text>
<text x="280" y="741" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 评估价值、时效及风险</text>
<text x="280" y="765" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 形成需求说明和优先级</text>
<rect x="595" y="650" width="285" height="155" rx="12" fill="#FFFFFF" stroke="#285DA8" stroke-width="1.8"/>
<rect x="595" y="650" width="7" height="155" rx="3" fill="#285DA8"/>
