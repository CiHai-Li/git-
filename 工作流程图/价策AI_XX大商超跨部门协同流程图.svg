<text x="112" y="184" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="600" fill="#172033">经营增长</text>
<text x="345" y="184" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="600" fill="#172033">价格竞争力</text>
<text x="610" y="184" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="600" fill="#172033">毛利与库存健康</text>
<text x="925" y="184" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="600" fill="#172033">商家生态稳定</text>
<text x="1210" y="184" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="600" fill="#172033">数据合规与安全</text>
<text x="1515" y="184" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="600" fill="#172033">可解释 · 可审计 · 可复盘</text>
