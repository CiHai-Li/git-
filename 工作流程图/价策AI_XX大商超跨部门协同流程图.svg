<text x="615" y="717" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 定义同款及到手价口径</text>
<text x="615" y="741" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 配置商品角色和价格带</text>
<text x="615" y="765" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 设置利润线与风险护栏</text>
<rect x="930" y="650" width="285" height="155" rx="12" fill="#FFFFFF" stroke="#285DA8" stroke-width="1.8"/>
<rect x="930" y="650" width="7" height="155" rx="3" fill="#285DA8"/>
<text x="948" y="682" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="17" font-weight="600" fill="#172033">产品配置与计算</text>
<text x="950" y="717" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 配置策略参数和适用范围</text>
<text x="950" y="741" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 运行诊断、拐点及模拟</text>
<text x="950" y="765" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 保留规则版本与证据链</text>
<rect x="1265" y="650" width="285" height="155" rx="12" fill="#FFFFFF" stroke="#285DA8" stroke-width="1.8"/>
<rect x="1265" y="650" width="7" height="155" rx="3" fill="#285DA8"/>
