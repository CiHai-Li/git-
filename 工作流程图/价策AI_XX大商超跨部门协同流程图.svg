<text x="80" y="58" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="32" font-weight="600" fill="#172033">价策 AI｜XX大商超跨部门定价决策闭环</text>
<text x="80" y="92" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="16" font-weight="400" fill="#667085">业务提出需求 · 中台设计策略 · 数据提供能力 · 产品输出决策 · 业务执行反馈</text>
