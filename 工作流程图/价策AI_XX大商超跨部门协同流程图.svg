<text x="670" y="1067" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 完成 SKU 标准化与同款匹配</text>
<text x="670" y="1091" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 统一到手价并识别异常</text>
<text x="670" y="1115" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 监控完整性、时效和可信度</text>
