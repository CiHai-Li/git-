<text x="1620" y="717" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 区分价格与非价格影响</text>
<text x="1620" y="741" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 评估策略命中和经营收益</text>
<text x="1620" y="765" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 更新规则、阈值及优先级</text>
