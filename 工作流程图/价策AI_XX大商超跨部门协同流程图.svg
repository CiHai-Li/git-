<text x="280" y="1067" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 接入授权 API 或合规采集</text>
<text x="280" y="1091" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 沉淀竞品、活动及价格快照</text>
<text x="280" y="1115" text-anchor="start" font-family="Microsoft YaHei,Arial" font-size="12.5" font-weight="400" fill="#667085">• 管理采集频率与失败重试</text>
